<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#141E33" />
      <stop offset="60%" stop-color="#0A0E1A" />
      <stop offset="100%" stop-color="#05070D" />
    </radialGradient>

    <!-- Electric Pulse Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="45%" stop-color="#818CF8" />
      <stop offset="70%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Core Glow Gradient -->
    <radialGradient id="glyphGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Upper Link Loop -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1024" height="1024" fill="url(#bg)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="512" cy="512" r="380" fill="url(#glyphGlow)" />

  <!-- Geometric Grid Accent (48px circles faint texture) -->
  <g opacity="0.04" stroke="#FFFFFF" stroke-width="2">
    <circle cx="512" cy="512" r="420" fill="none" />
    <circle cx="512" cy="512" r="280" fill="none" />
    <line x1="512" y1="92" x2="512" y2="932" />
    <line x1="92" y1="512" x2="932" y2="512" />
  </g>

  <!-- Central Symbol: The Pulse Link -->
  <g transform="translate(512, 512) rotate(-45) translate(-512, -512)" filter="url(#shadow)">
    
    <!-- Left Loop (Source / Discovery) -->
    <path d="M 390 350 
             L 300 350 
             A 160 160 0 0 0 300 670 
             L 390 670" 
          fill="none" 
          stroke="#6366F1" 
          stroke-width="72" 
          stroke-linecap="round" />

    <!-- Right Loop (Destination / Profit) -->
    <path d="M 634 350 
             L 724 350 
             A 160 160 0 0 1 724 670 
             L 634 670" 
          fill="none" 
          stroke="#10B981" 
          stroke-width="72" 
          stroke-linecap="round" />

    <!-- The Heartbeat Pulse Bridge (The Transformative Catalyst) -->
    <path d="M 290 510 
             L 430 510 
             L 475 390 
             L 545 630 
             L 590 510 
             L 734 510" 
          fill="none" 
          stroke="url(#pulseGrad)" 
          stroke-width="52" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Pulse Energy Nodes (Data Points) -->
    <circle cx="475" cy="390" r="16" fill="#818CF8" />
    <circle cx="545" cy="630" r="16" fill="#34D399" />
  </g>

  <!-- High-Fidelity 1px Rim Light (Apple HIG / Android M3 Polish) -->
  <rect x="1" y="1" width="1022" height="1022" rx="0" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" />
</svg>